<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your Construction Gossip password</title>
  </head>
  <body style="margin:0;background:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#151515;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <div style="font-size:24px;font-weight:700;margin-bottom:20px;">Construction Gossip</div>
                <h1 style="font-size:22px;margin:0 0 12px;">Reset your password</h1>
                <p style="font-size:16px;line-height:1.5;margin:0 0 24px;color:#555555;">
                  Enter this recovery code in the Construction Gossip app:
                </p>
                <div style="background:#fff1e8;border:1px solid #ff6a00;border-radius:10px;padding:18px;text-align:center;font-size:32px;font-weight:700;letter-spacing:6px;color:#151515;">
                  {{ .Token }}
                </div>
                <p style="font-size:14px;line-height:1.5;margin:24px 0 0;color:#777777;">
                  If you did not request a password reset, you can ignore this email. Do not share this code with anyone.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
